# Route index for SKILL.md. Select by requested deliverable, not keyword alone.
# references: primary reads. subroutines: load only when their condition applies.
# assets: optional output structures; use terminology-decision only for new names.
required_companions:
  terminology-discipline:
    when:
      - naming or renaming a technical concept
      - resolving conflicting or unsupported technical terminology
      - auditing terminology provenance or consistency
    references: [references/terminology-discipline.md]
    assets: [assets/terminology-decision-template.md]

routes:
  terminology-discipline:
    triggers: [terminology provenance, construct naming, acronym choice, proposed new term]
    references: [references/terminology-discipline.md]
    assets: [assets/terminology-decision-template.md]

  literature-reading:
    triggers: [paper summary, literature note, model abstraction analysis, paper reading]
    references: [references/literature-reading.md]
    assets: [assets/literature-note-template.md]

  research-brainstorming:
    triggers: [research brainstorming, vague research idea, research question development]
    references: [references/research-brainstorming.md]
    assets: [assets/research-plan-template.md]

  feasibility-check:
    triggers: [idea feasibility, model tractability, project potential]
    references: [references/feasibility-check.md]
    assets: [assets/research-plan-template.md]

  abstract-writing:
    triggers: [abstract drafting, abstract revision, structured abstract, abstract word limit]
    references: [references/abstract-writing.md]

  management-science-writing:
    triggers: [body prose, result narrative, conclusion writing, appendix writing, paper style revision]
    references: [references/management-science-writing.md]
    subroutines:
      theorem-interpretation:
        when: [a result needs a mechanism or economic interpretation]
        references: [references/theorem-interpretation.md]
        assets: [assets/theorem-interpretation-template.md]
      managerial-insights:
        when: [a result needs an evidence-supported operational implication]
        references: [references/managerial-insights.md]
      proof-rigor:
        when: [claim validity or proof obligations need checking]
        references: [references/proof-rigor.md]

  introduction-writing:
    triggers: [introduction drafting, introduction revision, contribution block, paper roadmap]
    references: [references/introduction-writing.md]
    assets: [assets/introduction-template.md]

  storyline-analysis:
    triggers: [storyline analysis, narrative arc, paper story, insight logic]
    references: [references/storyline-analysis.md]
    assets: [assets/storyline-analysis-template.md]
    subroutines:
      theorem-interpretation:
        when: [the result-to-insight bridge needs analysis]
        references: [references/theorem-interpretation.md]
      managerial-insights:
        when: [the story depends on a managerial recommendation]
        references: [references/managerial-insights.md]

  theorem-and-proof:
    triggers: [theorem interpretation, proof review, theorem statement, proof development]
    subroutines:
      theorem-interpretation:
        when: [the user requests interpretation or result narrative]
        references: [references/theorem-interpretation.md]
        assets: [assets/theorem-interpretation-template.md]
      proof-rigor:
        when: [the user requests formal development or review, or validity is uncertain]
        references: [references/proof-rigor.md]

  experiment-design:
    triggers: [experiment plan, simulation design, numerical section, robustness study]
    references: [references/experiment-design.md]
    assets: [assets/experiment-plan-template.md]

  managerial-insights:
    triggers: [managerial implication, operational recommendation, post-result discussion]
    references: [references/managerial-insights.md]
    subroutines:
      theorem-interpretation:
        when: [the supporting formal result needs interpretation]
        references: [references/theorem-interpretation.md]

  reviewer-critique:
    triggers: [referee report, reviewer critique, manuscript weaknesses, section review]
    references: [references/reviewer-critique.md]
    assets: [assets/reviewer-report-template.md]
    subroutines:
      rigor-and-consistency:
        when: [the request includes cross-section claim and evidence checks]
        references: [references/rigor-and-consistency.md]

  pre-submission-review:
    triggers: [pre-submission audit, full manuscript check, submission readiness, consistency audit]
    references: [references/rigor-and-consistency.md]
    assets: [assets/pre-submission-review-template.md]
    subroutines:
      proof-rigor:
        when: [the manuscript contains formal claims and proofs]
        references: [references/proof-rigor.md]
      experiment-design:
        when: [the manuscript contains numerical or empirical claims]
        references: [references/experiment-design.md]

  revision-audit:
    triggers: [revision history analysis, reviewer comment analysis, research taste distillation, skill improvement]
    references: [references/taste-evolution.md]
    assets: [assets/revision-audit-template.md]
